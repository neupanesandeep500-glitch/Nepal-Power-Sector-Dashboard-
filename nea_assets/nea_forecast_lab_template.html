<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NEA Forecast Lab</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; background:#f4f7fb; color:#20293a; }
  .wrap { padding:16px 18px 30px; }
  .panel { background:#fff; border-radius:12px; padding:16px 18px; margin-bottom:16px; box-shadow:0 1px 4px rgba(20,30,60,0.08); }
  .panel h3 { margin:0 0 12px; font-size:15px; font-weight:800; color:#0d47a1; display:flex; gap:8px; align-items:center; }
  .controls { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; }
  .field { display:flex; flex-direction:column; gap:4px; min-width:220px; }
  .field label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:#647085; }
  select, input[type=number] { padding:8px 10px; border-radius:6px; border:1px solid #c7d2e2; font-size:13px; }
  button#run-btn { background:linear-gradient(135deg,#1565c0,#0d47a1); color:#fff; border:none;
    padding:10px 22px; border-radius:8px; font-weight:700; cursor:pointer; font-size:13px; }
  button#run-btn:hover { opacity:0.92; }
  button#run-btn:disabled { opacity:0.5; cursor:not-allowed; }
  .chart-box { position:relative; height:400px; margin-top:14px; }
  .meta-row { display:flex; flex-wrap:wrap; gap:20px; margin-top:12px; font-size:13px; }
  .meta-row .item { background:#eef3fb; border-radius:6px; padding:6px 12px; }
  .meta-row .item b { color:#0d47a1; }
  .error-box { background:#fdecea; color:#a72820; border:1px solid #f5c2be; border-radius:8px; padding:12px 16px; font-size:13px; display:none; }
  .loading { font-size:13px; color:#647085; display:none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h3><i class="fas fa-flask"></i> NEA Forecast Lab</h3>
    <div class="controls">
      <div class="field">
        <label>Parameter</label>
        <select id="param-select"></select>
      </div>
      <div class="field">
        <label>Model</label>
        <select id="model-select"></select>
      </div>
      <div class="field" style="min-width:120px;">
        <label>Periods ahead</label>
        <input type="number" id="n-ahead" min="1" max="20" value="5">
      </div>
      <div class="field" style="min-width:auto;">
        <button id="run-btn"><i class="fas fa-play"></i> Run Forecast</button>
      </div>
    </div>
    <div class="loading" id="loading-msg"><i class="fas fa-spinner fa-spin"></i> Running forecast…</div>
    <div class="error-box" id="error-box"></div>
    <div class="chart-box"><canvas id="forecast-chart"></canvas></div>
    <div class="meta-row" id="meta-row"></div>
  </div>
</div>

<script>
let PARAMS = [];
let chart;

async function loadParams() {
  const res = await fetch("/api/nea-forecast-params");
  PARAMS = await res.json();
  const paramSelect = document.getElementById("param-select");
  paramSelect.innerHTML = "";
  PARAMS.forEach((p, i) => {
    const opt = document.createElement("option");
    opt.value = i; opt.textContent = p.label + (p.monthly ? "  (monthly)" : "  (annual)");
    paramSelect.appendChild(opt);
  });
  paramSelect.addEventListener("change", updateModelChoices);
  updateModelChoices();
}

function updateModelChoices() {
  const idx = document.getElementById("param-select").value;
  const p = PARAMS[idx];
  const modelSelect = document.getElementById("model-select");
  modelSelect.innerHTML = "";
  const models = [
    ["linear","Linear Regression"], ["holt","Holt Exponential Smoothing (trend)"],
    ["moving","Moving Average"], ["arima","ARIMA (auto order)"], ["hybrid","Hybrid (Linear + ARIMA)"],
  ];
  if (p && p.monthly) models.push(["sarima","SARIMA (seasonal, period=12)"]);
  models.forEach(([val, label]) => {
    const opt = document.createElement("option");
    opt.value = val; opt.textContent = label;
    modelSelect.appendChild(opt);
  });
}

async function runForecast() {
  const idx = document.getElementById("param-select").value;
  const p = PARAMS[idx];
  const model = document.getElementById("model-select").value;
  const nAhead = parseInt(document.getElementById("n-ahead").value || "5", 10);
  const errBox = document.getElementById("error-box");
  const loading = document.getElementById("loading-msg");
  errBox.style.display = "none";
  loading.style.display = "block";
  document.getElementById("run-btn").disabled = true;
  try {
    const res = await fetch("/api/nea-forecast", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ param_key: p.value, model, n_ahead: nAhead, monthly: !!p.monthly }),
    });
    const data = await res.json();
    if (data.error) { throw new Error(data.error); }
    renderChart(data, p.label);
    renderMeta(data);
  } catch (e) {
    errBox.textContent = "Forecast failed: " + e.message;
    errBox.style.display = "block";
  } finally {
    loading.style.display = "none";
    document.getElementById("run-btn").disabled = false;
  }
}

function renderChart(data, label) {
  const allLabels = data.past_labels.concat(data.pred_labels);
  const pastSeries = data.past_values.concat(Array(data.pred_labels.length).fill(null));
  const predSeries = Array(data.past_labels.length - 1).fill(null)
    .concat([data.base_value]).concat(data.pred_values);
  const datasets = [
    { label: "History", data: pastSeries, borderColor:"#1565c0", backgroundColor:"#1565c0", tension:0.2, borderWidth:2, pointRadius:3 },
    { label: "Forecast", data: predSeries, borderColor:"#c62828", backgroundColor:"#c62828", borderDash:[6,4], tension:0.2, borderWidth:2, pointRadius:3 },
  ];
  if (data.pred_lo && data.pred_lo.length) {
    const loSeries = Array(data.past_labels.length - 1).fill(null).concat([data.base_value]).concat(data.pred_lo);
    const hiSeries = Array(data.past_labels.length - 1).fill(null).concat([data.base_value]).concat(data.pred_hi);
    datasets.push({ label:"Upper (80% CI)", data:hiSeries, borderColor:"rgba(198,40,40,0.25)", backgroundColor:"rgba(198,40,40,0.08)", fill:"+1", pointRadius:0, borderWidth:1 });
    datasets.push({ label:"Lower (80% CI)", data:loSeries, borderColor:"rgba(198,40,40,0.25)", backgroundColor:"rgba(198,40,40,0.08)", fill:false, pointRadius:0, borderWidth:1 });
  }
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById("forecast-chart"), {
    type:"line",
    data:{ labels: allLabels, datasets },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{position:"bottom"}, title:{display:true,text:label} } }
  });
}

function renderMeta(data) {
  const row = document.getElementById("meta-row");
  row.innerHTML = "";
  const meta = data.meta || {};
  Object.keys(meta).forEach(k => {
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `${k}: <b>${meta[k]}</b>`;
    row.appendChild(div);
  });
}

document.getElementById("run-btn").addEventListener("click", runForecast);
loadParams().then(runForecast);
</script>
</body>
</html>
